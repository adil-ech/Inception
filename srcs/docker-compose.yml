services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: always
  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - mariadb
      - redis
    networks:
      - inception
    restart: always
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception
    restart: always
  redis:
    build: 
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    networks:
      - inception
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  static-site:
    build:
      context: ./requirements/bonus/static-site
      dockerfile: Dockerfile
    container_name: static-site
    networks:
      - inception
    restart: always
  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    networks:
      - inception
    depends_on:
      - mariadb
    restart: always
  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    networks:
      - inception
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wp_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - wordpress
    restart: always
  gitea:
    build:
      context: ./requirements/bonus/gitea
      dockerfile: Dockerfile
    container_name: gitea
    networks:
      - inception
    ports:
      - "3000:3000"
    volumes:
      - gitea_data:/home/git/gitea
    environment:
      # Tell Gitea to use SQLite3 (no external DB needed)
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/home/git/gitea/data/gitea.db
      # Server configuration
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__server__HTTP_PORT=3000
      # Run as git user
      - USER=git
      - USER_UID=1000
      - USER_GID=1000
      # Skip installer wizard completely
      - GITEA__security__INSTALL_LOCK=true
      # Default admin account (created automatically)
      - GITEA__admin__DISABLE_REGULAR_ORG_CREATION=false
    restart: always
volumes:
  db_data:
  wp_data:
  gitea_data:
networks:
  inception:
